# Passkey / WebAuthn Passwordless (Unit 2)
# Overrides Keycloak's built-in WebAuthn keys so the authenticator-selection screen and any
# server-rendered WebAuthn error use LifeMiles wording instead of Keycloak defaults.
# The ceremony screens themselves are rendered by hub-keycloack-login-ui and take their copy
# from the CMS; these keys cover only what Keycloak renders server-side.
webauthn-passwordless-display-name=Passkey
webauthn-passwordless-help-text=Ingresa sin contrase\u00f1a usando tu huella, rostro o PIN de este dispositivo.
webauthn-display-name=Passkey
webauthn-help-text=Confirma tu identidad con este dispositivo.
webauthn-registration-title=Registra tu Passkey
webauthn-available-authenticators=Passkeys registradas
webauthn-doAuthenticate=Ingresar con Passkey
webauthn-createdAt-label=Fecha de registro
webauthn-unsupported-browser-text=Este navegador no permite usar Passkey. Puedes ingresar con tu correo y contrase\u00f1a.
