webauthn-error-api-get=No pudimos iniciar la verificaci\u00f3n en este dispositivo.
webauthn-error-different-user=La Passkey utilizada no corresponde a esta cuenta.
webauthn-error-auth-verification=No pudimos verificar tu Passkey. Intenta de nuevo o usa otro m\u00e9todo.
webauthn-error-register-verification=No pudimos completar el registro de tu Passkey.
