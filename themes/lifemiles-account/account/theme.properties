# LifeMiles Account Console theme (Keycloak 26.x)
#
# Scope decision (Unit 2, question 1/6 answered A): branding and localization only.
#
# On Keycloak 24 and later the Account Console is "Account v3", a React application. Its
# supported customization surface is CSS, images and message bundles — the page structure is
# not template-driven. Building a bespoke Passkey management section would mean forking and
# maintaining the upstream React app across Keycloak upgrades, and Keycloak 26 already lists
# WebAuthn credentials natively under "Signing in", with delete support.
#
# The repository also contains authTheme/account/, which is the LEGACY FreeMarker account
# theme (account.ftl, totp.ftl, password.ftl, sessions.ftl). That theme cannot be used on
# Keycloak 26.x, so it is deliberately NOT extended here. The same applies to
# authTheme/admin/, which is the AngularJS admin console theme.
parent=keycloak.v3

styles=css/lifemiles-account.css

locales=en,es,fr,pt
