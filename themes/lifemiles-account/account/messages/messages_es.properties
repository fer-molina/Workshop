# LifeMiles Account Console — Spanish overrides (Unit 2, Task 6)
#
# Only the keys relevant to Passkey management are overridden. Everything else falls through
# to Keycloak's own bundle, which keeps the theme small and upgrade-safe.
#
# The list, rename and delete actions themselves are provided natively by Account v3 under
# "Signing in"; this file only makes the wording LifeMiles-appropriate and Spanish-first.

